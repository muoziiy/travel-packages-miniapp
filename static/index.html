<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#17212b">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Safar paketlari: shahar bo'ylab turlar, yakuniy narx bilan">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Safar paketlar</title>
<style>
  :root {
    --bg:#17212b; --card:#202b38; --accent:#2ea6ff; --btn-text:#ffffff; --text:#eef3f8; --muted:#8ba0b5;
    --border:rgba(255,255,255,.07);
    --ease-out:cubic-bezier(0.23,1,0.32,1);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; overscroll-behavior:none; }
  body {
    min-height:100dvh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:calc(14px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  h1 { font-size:22px; font-weight:700; letter-spacing:-0.02em; margin:8px 2px 6px; }
  .sub { color:var(--muted); font-size:13px; line-height:1.5; margin:0 2px 18px; user-select:text; }
  .chips { display:flex; gap:8px; margin-bottom:18px; overflow-x:auto; padding:2px 2px 4px; scrollbar-width:none; touch-action:pan-x; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex:none; padding:8px 16px; border-radius:999px; background:var(--card); color:var(--muted);
    font-size:13.5px; font-weight:500; white-space:nowrap; cursor:pointer;
    user-select:none; -webkit-user-select:none; touch-action:manipulation; border:1px solid var(--border);
    transition:background 150ms var(--ease-out), color 150ms var(--ease-out), border-color 150ms var(--ease-out), transform 160ms var(--ease-out);
  }
  .chip:active { transform:scale(0.96); }
  .chip.on { color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); border-color:color-mix(in srgb, var(--accent) 38%, transparent); }
  .card {
    background:var(--card); border:1px solid var(--border); border-radius:18px; margin-bottom:16px; overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.18);
    opacity:0; transform:translateY(10px); animation:enter 320ms var(--ease-out) forwards; cursor:pointer;
  }
  .card.no-anim { animation:none; opacity:1; transform:none; }
  .card:nth-child(2) { animation-delay:50ms; }
  .card:nth-child(3) { animation-delay:90ms; }
  .card:nth-child(4) { animation-delay:130ms; }
  .card:nth-child(n+5) { animation-delay:170ms; }
  @keyframes enter { to { opacity:1; transform:none; } }
  .card:active { filter:brightness(1.04); }
  .banner {
    position:relative; height:140px; background-size:cover; background-position:center; display:flex; align-items:flex-end; padding:14px 16px;
    font-size:21px; font-weight:700; letter-spacing:-0.01em; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.45);
  }
  .banner::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.4)); }
  .banner span { position:relative; z-index:1; }
  .inner { padding:14px 16px 16px; }
  .meta { color:var(--muted); font-size:13px; line-height:1.5; margin-bottom:12px; user-select:text; }
  .tier { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:10px 0; border-top:1px solid var(--border); font-size:14.5px; }
  .tier .price { font-weight:700; font-size:16px; color:var(--accent); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tier .onreq { font-weight:600; font-size:14px; color:var(--muted); white-space:nowrap; }
  .more-hint { display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding:10px; border-radius:10px;
    border:1px solid var(--border); color:var(--text); font-size:13.5px; font-weight:500; user-select:none; -webkit-user-select:none; }
  .more-hint .chev { color:var(--muted); transition:transform 200ms var(--ease-out); }
  .back {
    display:inline-flex; align-items:center; gap:6px; margin:0 2px 14px; padding:8px 14px 8px 10px; border-radius:999px;
    background:var(--card); border:1px solid var(--border); color:var(--text); font-size:14px; font-weight:500; cursor:pointer;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
    transition:transform 160ms var(--ease-out), background 150ms var(--ease-out);
  }
  .back:active { transform:scale(0.96); background:color-mix(in srgb, var(--text) 6%, transparent); }
  .detail-anim { animation:enter 260ms var(--ease-out) forwards; opacity:0; transform:translateY(8px); }
  .hero {
    position:relative; height:220px; border-radius:18px; overflow:hidden; background-size:cover; background-position:center;
    display:flex; align-items:flex-end; padding:18px; color:#fff; margin-bottom:16px;
    box-shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.18);
  }
  .hero::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.5)); }
  .hero .ht { position:relative; z-index:1; }
  .hero .ht b { display:block; font-size:24px; font-weight:700; letter-spacing:-0.02em; text-shadow:0 1px 6px rgba(0,0,0,.45); }
  .hero .ht i { display:block; font-style:normal; font-size:13px; opacity:.9; text-shadow:0 1px 4px rgba(0,0,0,.45); }
  .sec { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:18px 2px 8px; }
  .plist { list-style:none; }
  .plist li { display:flex; gap:9px; font-size:14px; line-height:1.5; padding:6px 0; user-select:text; }
  .plist li .n { color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; min-width:18px; }
  .hot { padding:10px 0; border-top:1px solid var(--border); font-size:14px; line-height:1.55; user-select:text; }
  .hot b { color:var(--accent); font-size:12.5px; font-weight:600; }
  .hot div { color:var(--text); }
  .infolist { list-style:none; }
  .infolist li { display:flex; gap:8px; font-size:13.5px; color:var(--muted); padding:5px 0; line-height:1.45; user-select:text; }
  .infolist li::before { content:'✓'; color:var(--accent); font-weight:700; }
  .note { color:var(--muted); font-size:12.5px; line-height:1.5; margin-top:10px; user-select:text; }
  .btn {
    display:block; margin-top:16px; text-align:center; background:var(--accent); color:var(--btn-text); padding:12px;
    border-radius:12px; font-size:15px; font-weight:600; text-decoration:none;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
    transition:transform 160ms var(--ease-out), filter 160ms var(--ease-out);
  }
  .btn:active { transform:scale(0.97); filter:brightness(.92); }
  .chip:focus-visible, .card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .empty { color:var(--muted); text-align:center; padding:36px 0; font-size:14px; line-height:1.5; }
  @media (prefers-reduced-motion:reduce) {
    .card, .detail-anim { animation:fade 200ms ease forwards; }
    @keyframes fade { to { opacity:1; transform:none; } }
    .chip, .back, .btn { transition:none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e) {} }

/* Telegram theme params -> CSS variables (fallbacks live in :root) */
const themeMap = [['--bg','bg_color'],['--card','secondary_bg_color'],['--text','text_color'],
                  ['--muted','hint_color'],['--accent','button_color'],['--btn-text','button_text_color'],
                  ['--link','link_color']];
function applyTheme(){
  if (!tg || !tg.themeParams) return;
  const p = tg.themeParams, s = document.documentElement.style;
  for (const [v,k] of themeMap) if (p[k]) s.setProperty(v, p[k]);
  const mc = document.querySelector('meta[name=theme-color]');
  if (mc && p.bg_color) mc.content = p.bg_color;
  try { if (tg.setHeaderColor && p.header_bg_color) tg.setHeaderColor(p.header_bg_color); } catch(e) {}
  try { if (tg.setBackgroundColor && p.bg_color) tg.setBackgroundColor(p.bg_color); } catch(e) {}
}
if (tg) { applyTheme(); if (tg.onEvent) tg.onEvent('themeChanged', applyTheme); }

let pkgs = [], filter = 'all', firstRender = true;
const BOOK = 'https://t.me/muoziiy';
const grads = {
  'istanbul':'linear-gradient(135deg,#8e2de2,#4a00e0)',
  'phuket':'linear-gradient(135deg,#11998e,#38ef7d)',
  'dubai':'linear-gradient(135deg,#f7971e,#ffd200)',
  'kuala-lumpur':'linear-gradient(135deg,#667eea,#764ba2)',
  'muscat':'linear-gradient(135deg,#d9a740,#8a6d1d)',
  'bali':'linear-gradient(135deg,#f9536b,#ef473a)',
  'shanghai':'linear-gradient(135deg,#e53935,#e35d5b)'
};
function money(n){ return '$' + n.toLocaleString('en-US'); }
function priceCell(t){ return t.price_per_person ? `<span class="price">${money(t.price_per_person)}${t.suffix||''}</span>` : `<span class="onreq">So'rov bo'yicha</span>`; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function renderChips(){
  const countries = ['all', ...new Set(pkgs.map(p => p.country))];
  return countries.map(c =>
    `<div class="chip ${filter===c?'on':''}" role="button" tabindex="0" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c==='all'?'Hammasi':esc(c)}</div>`).join('');
}
function setFilter(f){ filter = f; renderList(); }
function renderList(){
  const shown = pkgs.filter(p => filter==='all' || p.country===filter);
  const cls = firstRender ? '' : ' no-anim';
  document.getElementById('app').innerHTML = `
    <h1>Safar paketlar</h1>
    <div class="sub">Yakuniy narx, 1 kishi uchun (2 kishi borasiz). Kartani bosing — batafsil sahifa ochiladi.</div>
    <div class="chips" id="chips">${renderChips()}</div>
    <div id="list">${shown.length ? shown.map(p => `
      <div class="card${cls}" role="button" tabindex="0" onclick="openDetail('${p.id}')">
        <div class="banner" style="background-image:url('img/${p.id}.jpg'),${grads[p.id]||'linear-gradient(135deg,#232e3c,#17212b)'}"><span>${esc(p.title)}</span></div>
        <div class="inner">
          <div class="meta">${esc(p.days)} · ${esc(p.country)} · ${esc(p.from)}dan${p.direct ? " to'g'ri parvoz" : ''} · mehmonxona (nonushta), parvoz, transfer</div>
          ${p.tiers.map(t => `<div class="tier"><span>${esc(t.name)}</span>${priceCell(t)}</div>`).join('')}
          ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
          <div class="more-hint"><span>Batafsil ma'lumot</span><span class="chev">›</span></div>
        </div>
      </div>`).join('') : `<div class="empty">Bu yo'nalishda hozircha paket yo'q.<br>Tez orada qo'shiladi.</div>`}</div>`;
  firstRender = false;
}
function renderDetail(id){
  const p = pkgs.find(x => x.id === id);
  if (!p) { location.hash = ''; renderList(); return; }
  document.getElementById('app').innerHTML = `
    <div class="back" role="button" tabindex="0" onclick="goBack()">‹ Orqaga</div>
    <div class="detail-anim">
      <div class="hero" style="background-image:url('img/${p.id}.jpg'),${grads[p.id]||'linear-gradient(135deg,#232e3c,#17212b)'}">
        <div class="ht"><b>${esc(p.title)}</b><i>${esc(p.country)} · ${esc(p.days)} · ${esc(p.from)}dan${p.direct ? " to'g'ri parvoz" : ''}</i></div>
      </div>
      <div class="sec">Narxlar · 1 kishi uchun</div>
      ${p.tiers.map(t => `<div class="tier"><span>${esc(t.name)}</span>${priceCell(t)}</div>`).join('')}
      ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
      <div class="sec">Diqqatga sazovor joylar</div>
      <ul class="plist">${(p.attractions||[]).map((a,i) => `<li><span class="n">${i+1}</span><span>${esc(a)}</span></li>`).join('')}</ul>
      <div class="sec">Mehmonxonalar</div>
      ${Object.entries(p.hotels||{}).map(([tier, list]) => `<div class="hot"><b>${esc(tier)}</b><div>${list.map(esc).join(' · ')}</div></div>`).join('')}
      <div class="sec">Paketga kiritilgan</div>
      <ul class="infolist">${(p.info||[]).map(i => `<li>${esc(i)}</li>`).join('')}</ul>
      <a class="btn" href="${BOOK}" ${tg?'onclick="return openBook(event)"':''}>Band qilish</a>
    </div>`;
  if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch(e) {} }
}
function openDetail(id){ location.hash = '#/' + id; }
function goBack(){
  if (tg && tg.BackButton) { try { tg.BackButton.hide(); } catch(e) {} }
  history.length > 1 ? history.back() : (location.hash = '');
}
function route(){
  const m = (location.hash || '').match(/^#\/(.+)$/);
  m ? renderDetail(decodeURIComponent(m[1])) : (renderList(), tg && tg.BackButton && tg.BackButton.hide());
}
function openBook(e){ e.preventDefault(); tg.openTelegramLink(BOOK); return false; }
if (tg && tg.BackButton) { try { tg.BackButton.onClick(goBack); } catch(e) {} }
window.addEventListener('hashchange', route);
async function load_data(){
  try {
    let r = await fetch('./packages.json');
    if (!r.ok) throw 0;
    pkgs = await r.json();
  } catch (e) {
    pkgs = await (await fetch('/api/packages')).json();
  }
  route();
}
load_data();
</script>
</body>
</html>
