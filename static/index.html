<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Safar paketlar</title>
<style>
  :root { --bg:#17212b; --card:#232e3c; --accent:#2ea6ff; --text:#e8eef5; --muted:#8fa3b8; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  html, body { overscroll-behavior-y:none; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; padding:calc(12px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom)); }
  h1 { font-size:20px; margin:6px 4px 10px; }
  .sub { color:var(--muted); font-size:13px; line-height:1.45; margin:0 4px 16px; }
  .chips { display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { padding:8px 15px; border-radius:20px; background:var(--card); color:var(--muted); font-size:13px; white-space:nowrap; cursor:pointer; border:1px solid transparent; user-select:none; touch-action:manipulation; transition:transform 100ms ease-out; }
  .chip:active { transform:scale(0.96); }
  .chip.on { background:rgba(46,166,255,.15); color:var(--accent); border-color:rgba(46,166,255,.4); }
  .card { background:var(--card); border-radius:16px; margin-bottom:14px; overflow:hidden; }
  .banner { height:112px; display:flex; align-items:flex-end; padding:12px 14px; font-size:22px; font-weight:700; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.5); }
  .inner { padding:12px 14px 14px; }
  .meta { color:var(--muted); font-size:13px; line-height:1.45; margin-bottom:10px; }
  .tier { display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid rgba(255,255,255,.07); font-size:14px; }
  .tier span:last-child { font-weight:700; color:var(--accent); }
  .note { color:var(--muted); font-size:12px; margin-top:8px; line-height:1.4; }
  .btn { display:block; margin-top:12px; text-align:center; background:var(--accent); color:#fff; padding:11px; border-radius:10px; font-size:14px; font-weight:600; text-decoration:none; user-select:none; touch-action:manipulation; transition:transform 100ms ease-out; }
  .btn:active { transform:scale(0.97); }
</style>
</head>
<body>
<h1>✈️ Safar paketlar</h1>
<div class="sub">Yakuniy narx, 1 kishi uchun (2 kishi borasiz), Toshkentdan to'g'ri parvoz</div>
<div class="chips" id="chips"></div>
<div id="list"></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); if (tg.setHeaderColor) tg.setHeaderColor('#17212b'); if (tg.setBackgroundColor) tg.setBackgroundColor('#17212b'); }
let pkgs = [], filter = 'all';
const chips = [['all','Hammasi'],['umra','Umra'],['city','Shahar bo\'ylab']];
const grads = {
  'umra-lux':'linear-gradient(135deg,#1e5799,#7db9e8)',
  'istanbul':'linear-gradient(135deg,#8e2de2,#4a00e0)',
  'phuket':'linear-gradient(135deg,#11998e,#38ef7d)',
  'dubai':'linear-gradient(135deg,#f7971e,#ffd200)'
};
const emoji = {'umra':'🕋','city':'🌆'};
const BOOK = 'https://t.me/muoziiy';
function money(n){ return '$' + n.toLocaleString('en-US'); }
function renderChips(){
  document.getElementById('chips').innerHTML = chips.map(c =>
    `<div class="chip ${filter===c[0]?'on':''}" role="button" onclick="setFilter('${c[0]}')">${c[1]}</div>`).join('');
}
function setFilter(f){ filter = f; renderChips(); render(); }
function render(){
  const list = document.getElementById('list');
  const shown = pkgs.filter(p => filter==='all' || p.type===filter);
  list.innerHTML = shown.map(p => `
    <div class="card">
      <div class="banner" style="background:${grads[p.id]||'linear-gradient(135deg,#232e3c,#17212b)'}">${emoji[p.type]} ${p.title}</div>
      <div class="inner">
        <div class="meta">${p.days} · ${p.from}dan · mehmonxona (nonushta), parvoz, transfer${p.type==='city' ? ', viza' : ''}</div>
        ${p.tiers.map(t => `<div class="tier"><span>${t.name}</span><span>${money(t.price_per_person)}${t.suffix||''}</span></div>`).join('')}
        ${p.note ? `<div class="note">${p.note}</div>` : ''}
        <a class="btn" href="${BOOK}" ${tg?'onclick="return openBook(event)"':''}>Band qilish</a>
      </div>
    </div>`).join('');
}
function openBook(e){ e.preventDefault(); tg.openTelegramLink(BOOK); return false; }
async function load_data(){
  try {
    let r = await fetch('./packages.json');
    if (!r.ok) throw 0;
    pkgs = await r.json();
  } catch (e) {
    pkgs = await (await fetch('/api/packages')).json();
  }
  renderChips(); render();
}
load_data();
</script>
</body>
</html>
