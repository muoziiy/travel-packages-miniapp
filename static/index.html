<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Safar paketlar</title>
<style>
:root{
  --bg:#0e1621; --card:#17212b; --text:#ffffff; --muted:#708499;
  --accent:#64b5ef; --btn-text:#ffffff; --sec-header:#64b5ef; --sep:rgba(255,255,255,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Rubik',-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;display:flex;flex-direction:column}
#fx{position:fixed;top:-110px;left:50%;transform:translateX(-50%);width:560px;height:380px;border-radius:50%;overflow:hidden;filter:blur(48px) saturate(1.35);opacity:.5;pointer-events:none;z-index:0;-webkit-mask-image:radial-gradient(ellipse at center,black 35%,transparent 70%);mask-image:radial-gradient(ellipse at center,black 35%,transparent 70%)}
#fx img{width:200%;height:200%;object-fit:cover;transform:translate(-25%,-25%)}
#hdr{flex:0 0 auto;padding:14px 16px 6px;position:relative;z-index:2}
#hdr.hide{display:none}
.hrow{display:flex;align-items:center;gap:10px}
h1{font-size:27px;font-weight:800;letter-spacing:-.3px}
#lottie{display:inline-block;width:27px;height:27px}
.sub{color:var(--text);opacity:.62;font-size:14px;margin-top:1px}
#app{flex:1 1 auto;overflow-y:auto;padding:6px 16px 48px;position:relative;z-index:1;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#app::-webkit-scrollbar{display:none}
.sec{margin-top:22px}
.sec-title{color:var(--sec-header);font-size:13px;font-weight:600;margin:0 4px 8px}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative}
.row + .row::before{content:'';position:absolute;top:0;left:62px;right:0;height:1px;background:var(--sep)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:15.5px;font-weight:600}
.row .s{color:var(--muted);font-size:13px;margin-top:1px}
.row .v{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.row .v.mut{color:var(--muted);font-weight:500;font-size:13px}
.tile{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:color-mix(in srgb,var(--accent) 14%,transparent);color:#fff}
.ae{display:inline-block;vertical-align:middle;line-height:0}
.ae svg{width:100%;height:100%;display:block}
.ae-s{display:inline-block;vertical-align:middle;line-height:1;animation:aeb 2.4s ease-in-out infinite}
@keyframes aeb{0%,100%{transform:translateY(0)}50%{transform:translateY(-8%)}}
@media (prefers-reduced-motion:reduce){.ae-s{animation:none!important}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 6px;scrollbar-width:none;-ms-overflow-style:none;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--text);border:none;border-radius:20px;padding:8px 15px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .16s cubic-bezier(.23,1,.32,1),background .2s,color .2s}
.chip.on{background:var(--accent);color:var(--btn-text)}
.chip:active{transform:scale(.95)}
.city-card{position:relative;border-radius:20px;margin-top:36px;overflow:visible;cursor:pointer;transition:transform .16s cubic-bezier(.23,1,.32,1);background:linear-gradient(165deg,rgb(var(--tint) /.4) 0%,rgb(var(--tint) /0) 52%),var(--card)}
.city-card:active{transform:scale(.985)}
.shot{position:relative;margin:-16px 14px 0;height:148px;border-radius:15px;overflow:hidden;transform:rotate(-1.8deg);box-shadow:0 16px 32px rgba(0,0,0,.45),0 5px 12px rgba(0,0,0,.35);z-index:1}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);color:#fff;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:14px;white-space:nowrap}
.cc-body{padding:11px 14px 10px}
.cc-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cc-nm{font-size:19px;font-weight:800;display:flex;align-items:center;gap:7px}
.cc-cn{color:var(--muted);font-size:12.5px;white-space:nowrap}
.pill{display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--text) 8%,transparent);border:1px solid color-mix(in srgb,var(--text) 13%,transparent);backdrop-filter:blur(10px);border-radius:12px;padding:9px 12px;margin-top:7px}
.pill span{font-size:14px;font-weight:600}
.pill b{font-variant-numeric:tabular-nums;color:var(--accent);font-size:14.5px;font-weight:700}
.pill b.mut{color:var(--muted);font-weight:500;font-size:12.5px}
.more{margin-top:8px;text-align:center;color:var(--sec-header);font-size:13px;font-weight:600;padding-bottom:2px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:12px 6px 10px;scroll-snap-type:x proximity;scrollbar-width:none;-ms-overflow-style:none}
.hscroll::-webkit-scrollbar{display:none}
.feat-card{flex:0 0 auto;width:172px;border-radius:16px;overflow:visible;margin-top:14px;cursor:pointer;background:linear-gradient(165deg,rgb(var(--tint) /.45),rgb(var(--tint) /0) 60%),var(--card);transition:transform .16s cubic-bezier(.23,1,.32,1);scroll-snap-align:start}
.feat-card:active{transform:scale(.96)}
.feat-card .shot{margin:-10px 9px 0;height:114px;border-radius:12px;transform:rotate(-2.2deg)}
.fc-body{padding:10px 11px 12px}
.fnm{font-size:15px;font-weight:800}
.fwhy{color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.3}
.attr-card{flex:0 0 auto;width:170px;height:216px;border-radius:14px;overflow:hidden;position:relative;cursor:pointer;background:var(--card);transition:transform .16s cubic-bezier(.23,1,.32,1);scroll-snap-align:start}
.attr-card:active{transform:scale(.96)}
.attr-card img{width:100%;height:100%;object-fit:cover;display:block}
.attr-card .ov{position:absolute;inset:auto 0 0 0;padding:28px 10px 9px;background:linear-gradient(transparent,rgba(0,0,0,.78))}
.attr-card .fnm{font-size:13.5px;font-weight:700;color:#fff}
.attr-card .ph{width:100%;height:158px;background:linear-gradient(160deg,rgb(var(--tint,100 149 237) /.55),rgba(0,0,0,.35));display:flex;align-items:center;justify-content:center}
.attr-card .anm{font-size:14px;font-weight:700;padding:9px 11px 11px;line-height:1.3}
.slides{margin:0 -16px}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:212px;scroll-snap-align:center}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.dots{display:flex;gap:6px;justify-content:center;padding:10px 0 2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.4;transition:opacity .2s,width .2s}
.dot.on{opacity:1;background:var(--accent);width:16px;border-radius:3px}
.hero{position:relative;height:252px;margin:-6px -16px 0;overflow:hidden;background:var(--bg)}
.hero .sky{position:absolute;left:0;right:0;bottom:0;height:150px;overflow:hidden;animation:sfade .45s cubic-bezier(.23,1,.32,1) both}
.sky-track{display:flex;height:100%;width:max-content;animation:skyscroll 56s linear infinite;will-change:transform}
.sky-track img{height:100%;width:auto;flex:0 0 auto;display:block}
@keyframes skyscroll{from{transform:translateX(0)}to{transform:translateX(-25%)}}
@keyframes sfade{from{opacity:0}to{opacity:1}}
.hero .skyf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;filter:saturate(1.12)}
.hero.nosky .skyf{display:block}
.hero.nosky .sky{display:none}
.hero .ov{position:relative;z-index:1;padding:24px 18px 0}
.hero .kick{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);animation:hrise .3s cubic-bezier(.23,1,.32,1) .08s both}
.hero .nm{margin-top:5px;font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.03em;color:var(--text);animation:hrise .3s cubic-bezier(.23,1,.32,1) .14s both}
.hero .meta{margin-top:11px;display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--muted);animation:hrise .3s cubic-bezier(.23,1,.32,1) .2s both}
.hero .meta i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.hero.nosky::after{background:linear-gradient(transparent,rgba(0,0,0,.55))}
.hero.nosky .nm,.hero.nosky .meta{color:#fff}
.hero.nosky .nm{text-shadow:0 1px 14px rgba(0,0,0,.4)}
.chead{padding:14px 16px 2px}
.ckick{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);animation:hrise .3s cubic-bezier(.23,1,.32,1) .08s both}
.cnm{margin-top:5px;font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.03em;color:var(--text);animation:hrise .3s cubic-bezier(.23,1,.32,1) .14s both}
.cmeta{margin-top:11px;display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--muted);animation:hrise .3s cubic-bezier(.23,1,.32,1) .2s both}
.cmeta i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5}
@keyframes hrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cta{display:block;width:100%;margin-top:24px;background:var(--accent);color:var(--btn-text);border:none;border-radius:14px;padding:15px;font-size:16.5px;font-weight:700;cursor:pointer;transition:transform .16s cubic-bezier(.23,1,.32,1)}
.cta:active{transform:scale(.97)}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:15px}
.in{animation:fin .45s cubic-bezier(.23,1,.32,1) both}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none!important;transition:none!important}.sky-track,.hero .sky,.hero .kick,.hero .nm,.hero .meta{animation:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.23,1,.32,1);z-index:51;padding-bottom:calc(env(safe-area-inset-bottom) + 18px);will-change:transform}
#sheet-bg.open{opacity:1;pointer-events:auto}
#sheet.open{transform:translateY(0)}
#sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--muted);opacity:.5;margin:10px auto 0;cursor:pointer}
#sheet .sh-body{padding:14px 18px 0}
#sheet .sh-name{font-size:19px;font-weight:800}
#sheet .sh-desc{font-size:14.5px;margin-top:6px;line-height:1.6}
#sheet .sh-city{color:var(--sec-header);font-size:12.5px;font-weight:600;margin-top:10px}
.sh-slides{margin-top:12px;border-radius:14px;overflow:hidden}
.strack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none}
.strack::-webkit-scrollbar{display:none}
.sslide{flex:0 0 100%;height:190px;scroll-snap-align:center}
.sslide img{width:100%;height:100%;object-fit:cover;display:block}
.sh-info{margin-top:14px;background:color-mix(in srgb,var(--text) 5%,transparent);border-radius:12px;padding:4px 12px}
.sh-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0}
.sh-row + .sh-row::before{content:none}
.sh-row .si{width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
.sh-row .sl{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.sh-row .sv{font-size:14px;line-height:1.45;margin-top:1px}
.row[data-hot]{cursor:pointer}
.row[data-hot]:active{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.hlist{display:flex;flex-direction:column;gap:12px;padding:2px 0 4px}
.hcard{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--sep)}
.hstrip{display:flex;gap:2px;height:118px;overflow-x:auto;scrollbar-width:none}
.hstrip::-webkit-scrollbar{display:none}
.hstrip img{width:46%;flex:0 0 auto;object-fit:cover}
.htile{height:118px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.hbody{padding:10px 14px 2px}
.hnm{font-weight:700;font-size:15.5px}
.hmeta{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.hstars{color:#f5b940;letter-spacing:1px;font-size:12px}
.hrate{font-weight:700;color:var(--text)}
.hsub{margin-top:3px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{margin:10px 14px 14px;width:calc(100% - 28px);background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border:none;border-radius:12px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
.morehot{margin:2px 0 26px;text-align:center;color:var(--muted);font-size:13px}
.sec-note{margin:-6px 0 8px;font-size:12.5px;color:var(--muted)}
.start-line{margin:-6px 0 8px;font-size:13.5px;font-weight:700;color:var(--accent)}
.hnav{display:flex;flex-direction:column;gap:10px}
.hnav-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--sep);background:var(--card);cursor:pointer;transition:transform .16s cubic-bezier(.23,1,.32,1)}
.hnav-card:active{transform:scale(.98)}
.hn-tile{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:#fff}
.hn-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.hn-t{font-weight:700;font-size:15px;color:var(--text)}
.hn-s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hn-go{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--sep);color:var(--accent)}
.inc-row{cursor:pointer}
.inc-row:active{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.inc-go{flex:0 0 auto;color:var(--muted);display:flex;align-items:center}
.hhead{margin:14px 16px 4px;padding:18px 18px 16px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 26%,var(--card)),var(--card) 72%);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--sep))}
.hh-kicker{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
.hh-title{font-size:21px;font-weight:800;margin-top:4px;color:var(--text)}
.hh-sub{font-size:13px;color:var(--muted);margin-top:3px}
.inc-pop{padding:18px 18px 4px;text-align:center}
.inc-emoji{display:flex;justify-content:center;margin:8px 0 14px}
.req-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-bottom:18px}
.req-btn{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--sep);background:var(--card);color:var(--text);font-weight:600;font-size:15px;text-align:left;cursor:pointer}
.req-btn.primary{background:var(--accent);color:var(--btn-text);border:none}
.req-in{margin-top:14px;display:flex;flex-direction:column;gap:10px;padding-bottom:18px}
.req-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--sep);background:var(--card);color:var(--text);font-size:15px;outline:none}
</style>
</head>
<body>
<div id="fx"><img src="img/istanbul.jpg" alt="" onerror="this.remove()"></div>

<main id="app"></main>
<div id="sheet-bg"></div>
<div id="sheet" role="dialog"><div class="handle" id="sheet-handle"></div><div id="sheet-content"></div></div>

  const gal = p.gallery || [];
  app.innerHTML = `
  <div class="chead in"><div class="ckick">${flag(p.country)}<span>${esc(p.country)}</span></div><div class="cnm">${esc(p.title)}</div><div class="cmeta"><span>${esc(p.days)}</span><i></i><span>${p.direct ? "to'g'ri parvoz" : '1 x transfer'}</span></div></div>
  <section class="sec in"><div class="sec-title">Galereya</div>
    <div class="slides"><div class="track" id="track">${gal.map(g=>`<div class="slide"><img src="${g}" loading="lazy" alt="" onerror="this.parentNode.remove()"></div>`).join('')}</div>
    ${gal.length > 1 ? `<div class="dots">${gal.map((_,i)=>`<span class="dot${i?'':' on'}"></span>`).join('')}</div>` : ''}</div></section>
  <section class="sec in"><div class="sec-title">Narxlar · 1 kishi</div><div class="sec-note">7 kecha · 8 kun · boshqa muddatlar ham kelishiladi</div>${(()=>{const ps=p.tiers.map(t=>t.price_per_person).filter(v=>v>0);return ps.length?`<div class="start-line">Boshlanish narxi — ${price(Math.min(...ps))}</div>`:''})()}<div class="card">${p.tiers.map(t=>`<div class="row"><div class="grow"><div class="t">${esc(t.name)}</div><div class="s">${p.days} · ${esc(p.from)}</div></div><div class="v ${t.price_per_person?'':'mut'}">${price(t.price_per_person)}</div></div>`).join('')}</div></section>
  <section class="sec in"><div class="sec-title">Mashhur joylar</div><div class="hscroll">${p.attractions.map((a,i)=> a.img
    ? `<div class="attr-card" data-att="${i}"><img src="${a.img}" loading="lazy" alt="${esc(a.name)}" onerror="this.remove();var n=this.parentNode;var ph=document.createElement('div');ph.className='ph';ph.innerHTML='${emj(EMO[i % EMO.length],44).replace(/'/g,'&#39;').replace(/"/g,'&quot;')}';n.insertBefore(ph,n.firstChild)"><div class="ov"><div class="fnm">${esc(a.name)}</div></div></div>`
    : `<div class="attr-card" data-att="${i}"><div class="ph">${emj(EMO[i % EMO.length],44)}</div><div class="anm">${esc(a.name)}</div></div>`).join('')}</div></section>
  <section class="sec in"><div class="sec-title">Nima qilish kerak</div><div class="card">${p.things_to_do.map((t,i)=>`<div class="row"><div class="tile" style="${tbg(TODO_ICONS[i % TODO_ICONS.length])}">${icoF(TODO_ICONS[i % TODO_ICONS.length],18)}</div><div class="grow"><div class="t" style="font-weight:600;font-size:15px">${emojify(esc(t),16)}</div></div></div>`).join('')}</div></section>
  <section class="sec in"><div class="sec-title">Mehmonxonalar</div><div class="hnav">${p.tiers.map((t,i)=>`<div class="hnav-card" data-hot="${i}"><span class="hn-tile" style="${tbg('bed')}">${icoF('bed',20)}</span><span class="hn-body"><span class="hn-t">${esc(t.name)}</span><span class="hn-s">${esc((t.hotels_data||[]).slice(0,3).map(h=>h.n).join(', '))}${(t.hotels_data||[]).length>3?` +${t.hotels_data.length-3}`:''}</span></span><span class="hn-go">${ico('chev',16)}</span></div>`).join('')}</div></section>
  <section class="sec in"><div class="sec-title">Paketga kiritilgan</div><div class="card">${(p.inc||p.info.map(x=>({e:'✅',t:x}))).map((x,i)=>`<div class="row inc-row" data-inc="${i}"><span class="tile" style="${tbg(EMJ_ICON[x.e]||'')}">${EMJ_ICON[x.e]?icoF(EMJ_ICON[x.e],18):emj(x.e,20)}</span><div class="grow"><div class="t" style="font-weight:600;font-size:15px">${esc(x.t)}</div></div><span class="inc-go">${ico('chev',16)}</span></div>`).join('')}</div></section>
  ${TG ? '' : '<button class="cta" id="book">Narx so&#39;rash</button>'}`;
  app.querySelectorAll('[data-att]').forEach(el => el.addEventListener('click', () => openSheet(p, p.attractions[+el.dataset.att])));
  app.querySelectorAll('[data-hot]').forEach(el => el.addEventListener('click', () => { location.hash = '#/' + p.id + '/hotels/' + el.dataset.hot; }));
  app.querySelectorAll('[data-inc]').forEach(el => el.addEventListener('click', () => openInc(p, +el.dataset.inc)));
  const bk = document.getElementById('book'); if(bk) bk.addEventListener('click', () => openReq(p, -1, ''));
  initSlides(gal.length);
  hydrate(app);
  app.scrollTop = 0;
}
function initSlides(n){
  if(n < 2) return;
  const track = document.getElementById('track'), dots = [...app.querySelectorAll('.dot')];
  let idx = 0, userTouched = false;
  const sync = () => { idx = Math.round(track.scrollLeft / track.clientWidth); dots.forEach((d,i)=>d.classList.toggle('on', i === idx)); };
  track.addEventListener('scroll', sync, {passive:true});
  dots.forEach((d,i)=> d.addEventListener('click', () => { userTouched = true; track.scrollTo({left:i*track.clientWidth, behavior:'smooth'}); }));
  track.addEventListener('pointerdown', () => { userTouched = true; }, {once:true});
  slideTimer = setInterval(() => { if(document.hidden || userTouched) return; const nx = (idx + 1) % n; track.scrollTo({left:nx*track.clientWidth, behavior:'smooth'}); }, 3800);
}
function stopSlides(){ if(slideTimer){ clearInterval(slideTimer); slideTimer = null; } }
function renderHotels(p, ti){
  hdr.classList.add('hide');
  if(TG){ try{ TG.BackButton.show(); if(TG.MainButton) TG.MainButton.hide(); }catch(e){} }
  const t = p.tiers[ti], hs = t.hotels_data || [];
  app.innerHTML = `
  <div class="hhead in"><div class="hh-kicker">Mehmonxonalar</div><div class="hh-title">${esc(p.title)} · ${esc(t.name)}</div><div class="hh-sub">${esc(p.days)} · ${esc(p.from)}</div></div>
  <section class="sec in"><div class="sec-title">Paket narxi · 1 kishi</div><div class="card"><div class="row"><div class="grow"><div class="t">${esc(p.days)} · ${esc(p.from)}</div><div class="s">To'g'ri parvoz, transfer va nonushta bilan</div></div><div class="v ${t.price_per_person?'':'mut'}">${price(t.price_per_person)}</div></div></div></section>
  <section class="sec in"><div class="sec-title">Mehmonxonalar</div><div class="hlist">${hs.map(h => hotCard(h, p, ti)).join('')}</div>
  <div class="morehot">Boshqa mehmonxonalar ham so'rov bo'yicha mavjud</div></section>`;
  app.querySelectorAll('[data-hreq]').forEach(el => el.onclick = () => openReq(p, ti, el.dataset.hreq));
  hydrate(app); app.scrollTop = 0;
}
function hotCard(h, p, ti){
  if(h.pending) return `<div class="hcard"><div class="htile">${icoF('bed',26)}</div><div class="hbody"><div class="hnm">${esc(h.n)}</div><div class="hmeta"><span>Rasmlar va ma'lumot tez orada qo'shiladi</span></div></div><button class="hbtn" data-hreq="${esc(h.n)}">Narx so'rash</button></div>`;
  const st = Math.round((+h.s||0)/10); const stars = st ? '★'.repeat(Math.max(1,Math.min(5,st))) : '';
  const r = h.r ? `<span class="hrate">${esc(String(h.r))}</span>` : '';
  const rc = h.rc ? `<span>${h.rc} sharh</span>` : '';
  return `<div class="hcard"><div class="hstrip">${(h.im||[]).map(u=>`<img src="${u}" loading="lazy" alt="" onerror="this.remove()">`).join('') || `<div class="htile" style="width:100%">${icoF('bed',26)}</div>`}</div><div class="hbody"><div class="hnm">${esc(h.n)}</div><div class="hmeta">${stars?`<span class="hstars">${stars}</span>`:''}${r}${rc}</div><div class="hsub">${esc(h.a||'')}</div></div><button class="hbtn" data-hreq="${esc(h.n)}">Narx so'rash</button></div>`;
}
let reqCtx = null;
function openReq(p, ti, hn){
  reqCtx = {city: p.title, tier: (ti >= 0 && p.tiers[ti]) ? p.tiers[ti].name : '', hotel: hn || ''};
  const head = `${hn ? esc(hn) + ' · ' : ''}${esc(p.title)}${reqCtx.tier ? ' · ' + esc(reqCtx.tier) : ''}`;
  sheetContent.innerHTML = `<div class="sh-body"><div class="sh-name">Narx so'rash</div><div class="sh-desc">${head}<br>Qanday bog'lanamiz?</div>
    <div class="req-list">
      <button class="req-btn" id="rq1">Men bilan qo'ng'iroq qiling</button>
      <button class="req-btn" id="rq2">Telegram orqali bog'laning</button>
      <button class="req-btn" id="rq3">Men o'zim bog'lanaman</button>
    </div></div>`;
  document.getElementById('rq1').onclick = () => reqInput('call');
  document.getElementById('rq2').onclick = () => reqInput('tg');
  document.getElementById('rq3').onclick = () => { if(TG && TG.openTelegramLink) TG.openTelegramLink(BOOK); else location.href = BOOK; };
  sheetBg.classList.add('open'); sheet.classList.add('open'); sheetIsOpen = true;
  hydrate(sheetContent);
  if(TG){ try{ TG.BackButton.show(); }catch(e){} if(TG.HapticFeedback){ try{ TG.HapticFeedback.impactOccurred('light'); }catch(e){} } }
}
function reqInput(how){
  const ph = how === 'call';
  sheetContent.innerHTML = `<div class="sh-body"><div class="sh-name">${ph ? "Qo'ng'iroq uchun raqamingiz" : "Telegram username yoki raqamingiz"}</div>
    <div class="req-in"><input class="req-input" id="rqin" inputmode="${ph?'tel':'text'}" placeholder="${ph ? '+998 90 123 45 67' : '@username yoki +998...'}">
    <button class="req-btn primary" id="rqgo">Yuborish</button></div></div>`;
  hydrate(sheetContent);
  const inp = document.getElementById('rqin'); try{ inp.focus(); }catch(e){}
  document.getElementById('rqgo').onclick = () => { const v = (inp.value||'').trim(); if(!v){ try{ inp.focus(); }catch(e){} return; } sendLead(how, v); };
}
function sendLead(how, contact){
  const me = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
  const payload = {fo_lead:true, how, contact, city:reqCtx.city, tier:reqCtx.tier, hotel:reqCtx.hotel,
    user: me ? {id:me.id, name:[me.first_name,me.last_name].filter(Boolean).join(' '), username:me.username, lang:me.language_code} : null,
    at:new Date().toISOString()};
  let sent = false;
  if(TG && TG.sendData){ try{ TG.sendData(JSON.stringify(payload)); sent = true; }catch(e){} }
  if(!sent){ const txt = encodeURIComponent(`Assalomu alaykum! ${reqCtx.city}${reqCtx.hotel?' · '+reqCtx.hotel:''} paketi bo'yicha narx so'rayapman. Aloqa: ${contact}`); location.href = BOOK + '?text=' + txt; }
  sheetContent.innerHTML = `<div class="sh-body"><div class="sh-name">Rahmat!</div><div class="sh-desc">So'rovingiz yuborildi. Tez orada bog'lanamiz.</div></div>`;
  hydrate(sheetContent);
}
const sheet = document.getElementById('sheet'), sheetBg = document.getElementById('sheet-bg'), sheetContent = document.getElementById('sheet-content');
function openInc(p, i){
  const x = (p.inc||[])[i]; if(!x) return;
  sheetContent.innerHTML = `<div class="inc-pop"><div class="inc-emoji">${emj(x.e, 84)}</div><div class="sh-name">${esc(x.t)}</div><div class="sh-desc">${esc(x.d||'')}</div><div class="sh-city">${esc(p.title)} paketiga kiritilgan</div></div>`;
  sheetBg.classList.add('open'); sheet.classList.add('open'); sheetIsOpen = true;
  hydrate(sheetContent);
  if(TG){ try{ TG.BackButton.show(); }catch(e){} if(TG.HapticFeedback){ try{ TG.HapticFeedback.impactOccurred('light'); }catch(e){} } }
}
function openSheet(city, a){
  const imgs = a.imgs && a.imgs.length ? a.imgs : (a.img ? [a.img] : []);
  const inf = (icn, l, v) => v ? `<div class="sh-row"><span class="si" style="${tbg(icn)}">${icoF(icn,15)}</span><div><div class="sl">${l}</div><div class="sv">${esc(v)}</div></div></div>` : '';
  sheetContent.innerHTML = `${imgs.length > 1
    ? `<div class="sh-slides"><div class="strack" id="strack">${imgs.map(g=>`<div class="sslide"><img src="${g}" loading="lazy" alt="" onerror="this.parentNode.remove()"></div>`).join('')}</div></div><div class="dots" id="sdots">${imgs.map((_,i)=>`<span class="dot${i?'':' on'}"></span>`).join('')}</div>`
    : imgs.length === 1 ? `<img class="sh-img" src="${imgs[0]}" alt="" onerror="this.remove()">` : `<div class="sh-ph">${ico('map-pin',40)}</div>`}
    <div class="sh-body"><div class="sh-name">${esc(a.name)}</div><div class="sh-desc">${emojify(esc(a.desc || ''),17)}</div>
    ${a.bt || a.dur || a.tip ? `<div class="sh-info">${inf('sunrise','Eng yaxshi vaqt',a.bt)}${inf('clock','Davomiyligi',a.dur)}${inf('bulb','Maslahat',a.tip)}</div>` : ''}
    <div class="sh-city">${esc(city.title)} · ${esc(city.country)} paketiga kiradi</div></div>`;
  if(imgs.length > 1){
    const st = document.getElementById('strack'), sd = [...document.querySelectorAll('#sdots .dot')];
    let sidx = 0;
    st.addEventListener('scroll', () => { sidx = Math.round(st.scrollLeft / st.clientWidth); sd.forEach((d,i)=>d.classList.toggle('on', i === sidx)); }, {passive:true});
    sd.forEach((d,i)=> d.addEventListener('click', () => st.scrollTo({left:i*st.clientWidth, behavior:'smooth'})));
  }
  sheetBg.classList.add('open'); sheet.classList.add('open'); sheetIsOpen = true;
  hydrate(sheetContent);
  if(TG){ try{ TG.BackButton.show(); }catch(e){} if(TG.HapticFeedback){ try{ TG.HapticFeedback.impactOccurred('light'); }catch(e){} } }
}
function closeSheet(){ sheetBg.classList.remove('open'); sheet.classList.remove('open'); sheetIsOpen = false; }
sheetBg.addEventListener('click', closeSheet);
document.getElementById('sheet-handle').addEventListener('click', closeSheet);
async function boot(){
  try{ const r = await fetch('api/packages'); DATA = await r.json(); }
  catch(e){ const r2 = await fetch('packages.json'); DATA = await r2.json(); }
  if(!Array.isArray(DATA)) DATA = DATA.packages || [];
  initTG(); initEmoji(); hydrate(document.getElementById('hdr')); route();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
window.addEventListener('hashchange', route);
boot().catch(e => { app.innerHTML = `<div class="empty" style="padding-top:80px">Yuklanmadi 🔄<br><br><button class="cta" onclick="location.reload()">Qayta yuklash</button></div>`; });
</script>
